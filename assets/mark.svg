<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Money Bot (12.0). An original mark: one line draws an M and leaves it as a rising arrow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121815"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="38%" r="55%">
      <stop offset="0" stop-color="#1fe07f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1fe07f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#f2fff8"/>
      <stop offset="0.55" stop-color="#b9ffd9"/>
      <stop offset="1" stop-color="#22e584"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#25332c" stroke-width="4"/>
  <!-- soft light under the line -->
  <path d="M132 372 V168 L256 300 L366 190" fill="none" stroke="#22e584" stroke-opacity="0.07"
        stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 372 V168 L256 300 L366 190" fill="none" stroke="url(#ink)"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M418 138 L401 229 L327 155 Z" fill="#22e584" stroke="#22e584" stroke-width="10" stroke-linejoin="round"/>
  <!-- the bot's eye -->
  <circle cx="384" cy="372" r="22" fill="#22e584"/>
</svg>
