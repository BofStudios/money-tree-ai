<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Money Tree AI · fear-light emblem (2026). An original mark: a money tree inside a
       burning yellow ring, sixteen blades of light around it. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="64%">
      <stop offset="0" stop-color="#3a2d05"/>
      <stop offset="0.5" stop-color="#0d0a03"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.5" stop-color="#ffd60a" stop-opacity="0.65"/>
      <stop offset="0.72" stop-color="#ffb800" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffb800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#2b2104"/>
      <stop offset="1" stop-color="#050402"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8b8"/>
      <stop offset="0.42" stop-color="#ffd60a"/>
      <stop offset="1" stop-color="#c98a00"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
  </defs>

